<!doctype html>
<html>
<head><meta charset="utf-8"><title>browser-qpdf test harness</title></head>
<body>
<script type="module">
    import { runSuite } from './run-scenarios.mjs';

    /** Run a scenario suite ('encryption' | 'catalog') on the main thread. */
    window.runSuiteInPage = runSuite;

    /** Run a scenario suite in a module Web Worker. */
    window.runSuiteInWorker = (suite) =>
        new Promise((resolve, reject) => {
            const worker = new Worker(new URL('./worker.mjs', import.meta.url), { type: 'module' });
            worker.onmessage = ({ data }) => {
                worker.terminate();
                data.error ? reject(new Error(data.error)) : resolve(data.observations);
            };
            worker.onerror = (event) => {
                worker.terminate();
                reject(new Error(event.message || 'worker failed'));
            };
            worker.postMessage({ suite });
        });

    window.harnessReady = true;
</script>
</body>
</html>
